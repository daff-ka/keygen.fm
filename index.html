<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keygen FM</title>
<meta name="description" content="A web player for keygen and cracktro music.">
<!-- Favicons: Figma → Components → Favicon (Favicon/Glyph) -->
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="img/favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="img/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<!-- ?v= busts the browser cache after a deploy: bump it whenever CSS/JS change -->
<link rel="stylesheet" href="tokens.css?v=5">
<link rel="stylesheet" href="style.css?v=5">
<script>
  /* apply the saved theme before first paint to avoid a flash */
  try{const t=localStorage.getItem('kgfm-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
</script>
</head>
<body>
<div class="app">
  <header class="brand">
    <h1 class="wm" aria-label="Keygen FM"><span aria-hidden="true">KEYGEN</span><span class="fm" aria-hidden="true">FM</span></h1>
    <button class="ib sm" id="themeBtn" aria-label="Switch to dark theme" title="Switch to dark theme"></button>
    <button class="ib sm" id="sideBtn" aria-controls="side" aria-expanded="true" aria-label="Collapse playlist" title="Collapse playlist ([)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15"/><path d="M9.5 4.5v15"/></svg></button>
  </header>

  <aside class="side" id="side" aria-labelledby="plHead">
    <div class="side-head"><h2 id="plHead">Playlist</h2><p class="sum" id="sum"></p></div>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Search tracks" aria-label="Search the playlist" autocomplete="off">
      </label>
      <div class="seg" id="seg" role="group" aria-label="Filter by format"></div>
    </div>
    <ol class="list" id="list"></ol>
  </aside>

  <main class="main">
    <section class="np" aria-labelledby="npHead">
      <h2 id="npHead" class="sr">Now playing</h2>
      <div class="screen"><canvas id="stage" aria-hidden="true"></canvas></div>
      <div class="track"><h3 class="title" id="title"></h3><p class="meta" id="meta"></p></div>
      <div class="scrub">
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position in track">
        <div class="times" aria-hidden="true"><span id="tEl">0:00</span><span id="tRem">-0:00</span></div>
      </div>
      <div class="ctrl">

        <button class="ib" id="prevBtn" aria-label="Previous track" title="Previous track (Z)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4.5" y="5" width="2.5" height="14" rx="1.25"/><path d="M19.5 6.2v11.6a1 1 0 0 1-1.55.83L9.7 12.83a1 1 0 0 1 0-1.66l8.25-5.8a1 1 0 0 1 1.55.83z"/></svg></button>
        <button class="play" id="playBtn" aria-label="Play" title="Play (Space)"></button>
        <button class="ib" id="nextBtn" aria-label="Next track" title="Next track (B)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="17" y="5" width="2.5" height="14" rx="1.25"/><path d="M4.5 6.2v11.6a1 1 0 0 0 1.55.83l8.25-5.8a1 1 0 0 0 0-1.66L6.05 5.37A1 1 0 0 0 4.5 6.2z"/></svg></button>
        <button class="ib tg" id="repBtn" aria-pressed="false" data-mode="off" aria-label="Repeat: off" title="Enable repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
      </div>
      <div class="volume">
        <button class="ib" id="muteBtn" aria-pressed="false" aria-label="Mute" title="Mute (M)"><svg id="muteIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button>
        <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
        <svg class="vhi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      </div>
    </section>
  </main>
</div>
<script src="app.js?v=5" defer></script>
</body>
</html>
